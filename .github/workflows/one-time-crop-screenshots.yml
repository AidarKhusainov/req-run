name: One-time screenshot cropping
on:
  push:
    branches: [docs/crop-reqrun-screenshots]
    paths:
      - .github/workflows/one-time-crop-screenshots.yml

permissions:
  contents: write

jobs:
  crop:
    if: github.event.head_commit.message == 'chore: prepare screenshot cropping'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pillow
        run: |
          python3 -m venv /tmp/reqrun-crop-venv
          /tmp/reqrun-crop-venv/bin/python -m pip install --disable-pip-version-check Pillow
      - name: Crop images without scaling or changing UI content
        run: |
          /tmp/reqrun-crop-venv/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image
          boxes = {
              "editor-toolbar-gutter.png": (282, 42, 1120, 720),
              "response-viewer-history.png": (40, 495, 1130, 1060),
              "settings-reqrun.png": (262, 41, 990, 294),
              "history-context-menu.png": (35, 490, 1110, 1005),
              "toolbar-templates-menu.png": (290, 50, 1040, 475),
              "env-file-example.png": (47, 45, 735, 283),
              "editor-context-actions.png": (315, 150, 1020, 884),
              "run-selected-files.png": (50, 91, 733, 820),
          }
          for name, bounds in boxes.items():
              path = Path("docs/screenshot") / name
              with Image.open(path) as original:
                  assert original.format == "PNG", name
                  assert bounds[0] >= 0 and bounds[1] >= 0
                  assert bounds[2] <= original.width and bounds[3] <= original.height, name
                  crop = original.crop(bounds)
                  assert crop.size == (bounds[2] - bounds[0], bounds[3] - bounds[1])
                  crop.save(path, "PNG", optimize=True)
                  print(f"{name}: {original.width}x{original.height} -> {crop.width}x{crop.height}")
          PY
      - name: Commit cropped screenshots and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshot/*.png
          git rm .github/workflows/one-time-crop-screenshots.yml
          git commit -m "docs: focus screenshots on plugin UI without changing content"
          git push
